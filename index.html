    <!-- Thème jour / nuit posé avant le rendu (évite un flash blanc en mode nuit).
         Même logique que src/theme/theme.ts ; l'admin reste en mode jour. -->
    <script>
      (function () {
        try {
          var p = location.pathname, t;
          if (p.indexOf('/admin') === 0 && p.indexOf('/admin/login') !== 0) {
            t = 'light';
          } else {
            t = localStorage.getItem('loom-theme');
            if (t !== 'light' && t !== 'dark') t = 'dark'; // mode nuit par défaut (DEFAULT_THEME)
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
