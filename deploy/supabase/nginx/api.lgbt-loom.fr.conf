# nginx (sur l'hôte) : api.lgbt-loom.fr → passerelle Supabase auto-hébergée (127.0.0.1:8000).
# À copier dans /etc/nginx/sites-available/ puis activer ; certbot ajoute ensuite
# le HTTPS (sudo certbot --nginx -d api.lgbt-loom.fr). Voir deploy/supabase/README.md.
#
# Seules les routes utilisées par le site sont publiques. Le Studio (tableau de
# bord) et tout le reste ne sont PAS relayés : on y accède par tunnel SSH.

server {
    listen 80;
    listen [::]:80;
    server_name api.lgbt-loom.fr;

    # Requêtes de l'API : petites (pas de fichiers, les photos vont au serveur d'images)
    client_max_body_size 2m;

    # Modèles d'e-mails en français, lus par le service Auth (GOTRUE_MAILER_TEMPLATES_*)
    location /email-templates/ {
        alias /opt/supabase-loom/email-templates/;
        default_type text/html;
    }

    location ~ ^/(auth|rest|functions)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # La sync HelloAsso peut prendre plusieurs dizaines de secondes
        proxy_read_timeout 150s;
    }

    location / {
        return 404;
    }
}
